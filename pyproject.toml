[build-system]
requires = ["setuptools==84.2.1", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-birth-chart-study"
version = "0.2.0"
description = "Reproducible structural-signal research across four declared birth-chart models"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dynamic = ["dependencies"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["open_birth_chart*"]

[tool.setuptools.package-data]
open_birth_chart = ["*.cjs"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
