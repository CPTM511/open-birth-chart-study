name: R9 release and fixed-reference arithmetic
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  r9-public-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5
      - name: Verify preserved R8 files and public R9 aggregate release
        run: python scripts/verify_frozen_releases.py
      - name: Verify independent enumeration and finite-population arithmetic
        run: python -c "from verify_math import run_checks; print(run_checks())"
        env:
          PYTHONPATH: rounds/r9/methods
